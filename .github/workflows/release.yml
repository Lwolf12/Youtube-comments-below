# Publishes a GitHub Release when a tag of the form v<version> is pushed,
# e.g. v1.0.1. The release gets a ZIP of the extension as its asset, and
# GitHub counts downloads per asset.
#
# To cut a release (see RELEASING.md):
#   git tag v1.0.1
#   git push origin v1.0.1

name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the manifest version
        id: meta
        run: |
          ver="${GITHUB_REF_NAME#v}"
          manifest_ver=$(grep -oP '"version"\s*:\s*"\K[^"]+' manifest.json)
          if [ "$manifest_ver" != "$ver" ]; then
            echo "Tag version $ver does not match manifest.json version $manifest_ver" >&2
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      # The ZIP holds the extension in a youtube-comments-below folder, with
      # the README and LICENSE but not this workflow or the store material.
      - name: Zip the extension
        run: |
          git archive --format=zip --prefix=youtube-comments-below/ \
            -o "youtube-comments-below-v${{ steps.meta.outputs.ver }}.zip" HEAD -- . \
            ':!.github' ':!.gitignore' ':!RELEASING.md' ':!store'

      - name: Create the release with the ZIP attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.meta.outputs.ver }}"
          gh release create "$GITHUB_REF_NAME" "youtube-comments-below-v$ver.zip" \
            --title "v$ver" \
            --notes "Download the ZIP, extract it, then in Chrome open chrome://extensions, turn on Developer mode, click **Load unpacked** and pick the \`youtube-comments-below\` folder. Details in the [README](https://github.com/${GITHUB_REPOSITORY}#readme)."
